[project]
name = "tunbench-analyze"
version = "0.1.0"
description = "Per-measurement energy and wakeups of a TunBench run"
requires-python = ">=3.11"
dependencies = ["perfetto==0.59.1"]

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
