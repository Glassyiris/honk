[target.bpfel-unknown-none]
rustflags = [
  "-C",
  "opt-level=2",
  "-C",
  "llvm-args=-inline-threshold=300",
  "-C",
  "linker=/root/.cargo/bin/bpf-linker-wrapper",
  "-C",
  "debuginfo=2",
  "-C",
  "link-arg=--emit=obj",
  "-C",
  "link-arg=--llvm-args=-bpf-stack-size=4096",
  "-C",
  "link-arg=--btf",
]
