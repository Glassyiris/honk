[package]
name = "honk-tool"
version = "0.0.1-alpha"
edition = "2024"
description = "honk CLI toolbox: subscription checks, datapath diagnostics"

[[bin]]
name = "honk-tool"
path = "src/main.rs"

[features]
default = []
honk-policy = [
    "honk-config/honk-policy",
    "honk-core/honk-policy",
    "honk-outbound/honk-policy",
]

[dependencies]
honk-config.workspace = true
honk-ebpf-common.workspace = true
honk-outbound = { workspace = true, features = ["rprx"] }
honk-core = { path = "../honk-core", default-features = false }

anyhow.workspace = true
clap.workspace = true
libc.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
