name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev
      # Full suite minus the known-failing pre-existing tests (see AGENTS.md
      # "Current test status": share_link TOML round-trip x2,
      # config_dae_routing x1).
      - run: |
          cargo test --workspace --no-fail-fast -- \
            --skip test_config_toml_round_trip \
            --skip test_to_file_and_from_file_by_extension \
            --skip test_routing_with_config_dae

  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install Rust nightly (for the eBPF object)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Point eBPF .cargo/config at the installed bpf-linker
        run: |
          sed -i 's|linker=/root/.cargo/bin/bpf-linker-wrapper|linker=bpf-linker|' \
            crates/honk-ebpf/.cargo/config.toml

      # The eBPF object is target-independent; build it once on the host so
      # cross builds just pick it up (build.rs locates it when present).
      - name: Build eBPF object
        run: |
          cd crates/honk-ebpf
          cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none

      # aya refuses objects without BTF ("no BTF parsed for object") — fail
      # the build here instead of at runtime on a gateway.
      - name: Verify eBPF object has BTF
        run: readelf -S crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf | grep -q '\.BTF'

      # boring-sys (BoringSSL, C++) needs a clang-compatible target toolchain:
      # under cross compilation CMake injects clang-style --target flags into
      # boring-sys' ASM rules that real GCC rejects, and zig rejects the Rust
      # triple spelling — ci/zigcc / ci/zigcxx strip those flags and re-anchor
      # on the zig-style target in $ZIGCC_TARGET.
      - name: Install zig (non-native targets)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # NB: the nightly step above makes nightly the DEFAULT toolchain, and
      # rust-toolchain's `target` input installs the std only for stable —
      # build with +stable explicitly or cross targets fail with
      # "can't find crate for `core`".
      - name: Build honk-core (native gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo +stable build --release -p honk-core --features ebpf --target ${{ matrix.target }}

      - name: Build honk-core (cross via zig wrappers)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          export ZIGCC_TARGET="${T/-unknown/}"
          U=$(printf '%s' "$T" | tr 'a-z-' 'A-Z_')
          eval "export CC_${U}=\$PWD/ci/zigcc"
          eval "export CXX_${U}=\$PWD/ci/zigcxx"
          eval "export CARGO_TARGET_${U}_LINKER=\$PWD/ci/zigcc"
          # musl: let zig supply the CRT (Rust's self-contained rcrt1.o and
          # zig's crt1.o both define _start).
          if [[ "$T" == *-musl ]]; then
            eval "export CARGO_TARGET_${U}_RUSTFLAGS='-C link-self-contained=no'"
          fi
          # boring-sys generates its bindings with bindgen at build time —
          # point it at zig's target headers, not the host's.
          export BINDGEN_EXTRA_CLANG_ARGS="$(ci/zig-bindgen-env "$ZIGCC_TARGET")"
          cargo +stable build --release -p honk-core --features ebpf --target "$T"

      - name: Package artifact
        run: |
          name="honk-core-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/honk-core" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honk-core-${{ matrix.target }}
          path: honk-core-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    name: GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
